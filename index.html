<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valou</title>
<link rel="icon" type="image/png" href="favicon-48.png">
<meta http-equiv="refresh" content="1; url=demo/">
<style>
  :root { --fond: #F5EFE3; --texte: #0A2A55; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fond: #0f1a2b; --texte: #e8eef8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond); color: var(--texte); font: 600 17px system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: inherit; }
</style>
</head>
<body>
<p>Ouverture de Valou…<br><a href="demo/">Continuer</a></p>
<script>
/* hoono.be ouvre la nouvelle appli (demo/). L'ancienne appli est à hoono.be/ancienne.html.
   On retire d'abord l'ancien « service worker » et ses copies gardées sur le téléphone, qui affichaient une vieille version. */
(async () => {
  try {
    if ("serviceWorker" in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
  } catch (e) {}
  location.replace("demo/");
})();
</script>
</body>
</html>
