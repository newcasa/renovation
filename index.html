<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Estimation rénovation</title><link rel="icon" href="data:,">
<style>

</style></head><body><div id="m"></div>
<nav><button data-go="h">Accueil</button><button data-go="e">Espaces</button><button data-go="t">Techniques</button><button data-go="s">Synthèse</button><button data-go="p">Tarifs</button></nav>
<script>
const $=s=>document.querySelector(s);
// Ratios (€ min / max) issus du fichier RENO.xlsx
const SOL={parquet:[35,120],carrelage:[40,120]},MUR={plafonnage:[40,85],carrelage:[40,120]},PL=[40,85],MEU={cuisine:[5000,25000],sdb:[7000,20000]};
const T=[["Menuiseries",[["ch","Châssis (PVC)","unité",500,900],["ca","Châssis aluminium","unité",500,900],["pe","Porte d'entrée","unité",1500,3500],["pi","Portes intérieures","unité",300,700],["pg","Porte de garage","unité",800,5500],["vo","Volets","unité",150,500]]],
["Électricité",[["co","Coffret / tableau électrique","unité",800,1500],["re","Réseau électrique complet (prises, points lumineux)","unité",60,120],["mc","Mise en conformité","unité",135,400]]],
["Sanitaire",[["pl","Arrivée d'eau et évacuation des eaux","m²",30,80],["cha","Chaudière gaz condensation","unité",3000,7500],["pac","Pompe à chaleur","unité",9000,18500],["rad","Radiateurs","unité",300,800]]],
["Gros œuvre",[["da","Dalle béton","m²",120,200],["mp","Ouverture mur porteur","unité",1500,4000],["dem","Démolition intérieure","m²",20,60],["dr","Drainage périphérique","ml",80,150]]],
["Isolation",[["fa","Façade","m²",0,0,[["Ravalement",40,120],["Enduit / crépi",30,70],["Isolation intérieure",40,90],["Isolation extérieure (ITE)",110,250]]],["to","Toiture (isolation)","m²",0,0,[["Isolation combles",20,55],["Isolation sous rampants",40,90],["Isolation sarking",90,160]]]]],
["Toiture",[["dp","Dépose ancienne toiture","m²",25,45],["st","Sous-toiture","m²",10,25],["cv","Couverture","m²",0,0,[["Tuiles béton",70,110],["Tuiles terre cuite",85,140],["Ardoises artificielles",75,120],["Ardoises naturelles",130,220],["Toiture plate EPDM",120,250]]],["cp","Charpente","m²",0,0,[["Traitement",15,30],["Remplacement",200,400]]],["zi","Zinguerie (gouttières)","ml",40,80],["no","Noues / abergements","ml",60,150]]],
["Extérieurs",[["te","Terrasse","m²",80,200],["al","Allée / pavage","m²",40,100],["cl","Clôture","ml",50,150],["ja","Jardin / nivellement","m²",20,50]]]];
const mk=(n,k)=>({n,k,sol:null,sT:"parquet",sOn:0,m:null,mT:"plafonnage",mOn:0,pOn:0,meu:0});
let S;try{S=JSON.parse(localStorage.getItem("reno"))}catch(e){}
S=S||{rooms:[mk("Salle de bain","sdb"),mk("Salon"),mk("Salle à manger"),mk("Cuisine","cuisine"),mk("Chambre 1"),mk("Chambre 2")],t:{},imp:15,ach:125000,fr:15,tx:4.1,mo:360,v:"h",o:{}};
const save=()=>{try{localStorage.setItem("reno",JSON.stringify(S))}catch(e){}};
const n=x=>Math.max(0,+x||0),E=x=>Math.round(x).toLocaleString("fr-BE")+" €",rng=a=>a[0]||a[1]?E(a[0])+" – "+E(a[1]):"—";
const mm=r=>r.m==null?n(r.sol)*2.5:n(r.m);
const P=(k,d)=>{const o=(S.p||{})[k]||{};return[o[0]==null?d[0]:o[0],o[1]==null?d[1]:o[1]]};
const sumR=f=>S.rooms.reduce((a,r)=>a+n(r[f]),0),MS=()=>S.mes||{},LF=()=>{const m=MS();return n(m.f1)+n(m.f2)+n(m.f3)+n(m.f4)},TO=()=>n(MS().toit);
const AQ={ch:()=>sumR('ch'),ca:()=>sumR('ch')};
const CHASSIS=['ch','ca'];
const chassisTotal=()=>Math.max(0,sumR('ch'));
function syncChassis(changed){
  const total=chassisTotal(), t=S.t||(S.t={}), pvc=t.ch||{}, alu=t.ca||{};
  let value=changed==='ca'?n(alu.q):n(pvc.q);
  if(changed!=='ca' && changed!=='ch' && pvc.q==null && alu.q==null)value=total;
  value=Math.max(0,Math.min(total,value));
  t.ch=Object.assign({},pvc,{q:changed==='ca'?Math.max(0,total-value):value});
  t.ca=Object.assign({},alu,{q:changed==='ca'?value:Math.max(0,total-value)});
}
const qty=(id,s)=>CHASSIS.includes(id)?n((S.t[id]||{}).q):s.q==null?(AQ[id]?AQ[id]():0):n(s.q);
function ra(){
  CHASSIS.forEach(id=>{const w=document.querySelector('[data-p="t.'+id+'.q"]');if(w&&document.activeElement!==w)w.value=(S.t[id]||{}).q||''})
}
const mes=()=>{const m=MS();return`<div class='c'><h3>Mesures de la visite</h3><small>Les quantités des postes concernés se calculent seules (façades : longueur × 6 m pour R+1, × 9 m pour R+2, comme dans ton Excel). Tu peux les corriger dans chaque poste.</small><label>Façade avant R+1 (longueur en m)${I('mes.f1',m.f1)}</label><label>Façade avant R+2 (longueur en m)${I('mes.f2',m.f2)}</label><label>Façade arrière R+1 (longueur en m)${I('mes.f3',m.f3)}</label><label>Façade arrière R+2 (longueur en m)${I('mes.f4',m.f4)}</label><label>Surface de toiture (m²)${I('mes.toit',m.toit)}</label></div>`};
const LB=k=>{const o=(S.p||{})[k]||{};return[n(o[2]),n(o[3])]};
const esc=s=>String(s??'').replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||'&#39;'));
let armed=-1,armR=-1;
const PH={};let DB,PHP;
const idb=()=>DB||(DB=new Promise((ok,ko)=>{try{const r=indexedDB.open('reno',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph',{autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>ko()}catch(e){ko()}}));
const tx=(m,f)=>idb().then(d=>new Promise((ok,ko)=>{const q=f(d.transaction('ph',m).objectStore('ph'));q.onsuccess=()=>ok(q.result);q.onerror=()=>ko()}));
const phl=()=>PHP||(PHP=Promise.all([tx('readonly',s=>s.getAllKeys()),tx('readonly',s=>s.getAll())]).then(r=>{r[1].forEach((x,i)=>(PH[x.adr]=PH[x.adr]||[]).push({k:r[0][i],d:x.data,c:x.cap||''}))}).catch(()=>{}));
function drawPh(){const el=$('#ph');if(!el||!S.props[S.cur])return;const a=PH[S.props[S.cur].id]||[];el.innerHTML=`<div style='display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px'>`+a.map(p=>`<div style='min-width:0'><img alt='' src='${p.d}' data-ph='${p.k}' style='width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px'><small style='display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>${esc(p.c||'')}</small></div>`).join('')+`</div>`;const c=$('#pc');if(c)c.textContent=a.length?a.length+' photo'+(a.length>1?'s':''):''}
async function ph(){if(!$('#ph'))return;await phl();drawPh()}
const shrink=f=>new Promise((ok,ko)=>{const rd=new FileReader();rd.onerror=ko;rd.onload=()=>{const i=new Image();i.onerror=ko;i.onload=()=>{const r=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.src=rd.result};rd.readAsDataURL(f)});
document.addEventListener('change',async e=>{if(e.target.id!='pf')return;const id=S.props[S.cur].id;await phl();for(const f of e.target.files){try{const d=await shrink(f),k=await tx('readwrite',s=>s.add({adr:id,data:d,t:Date.now()}));(PH[id]=PH[id]||[]).push({k,d,c:''});drawPh()}catch(x){const c=$('#pc');if(c)c.textContent='erreur d’enregistrement'}}e.target.value=''});
document.addEventListener('change',async e=>{const k=e.target.dataset&&e.target.dataset.cap;if(k==null)return;const p=(PH[S.props[S.cur].id]||[]).find(x=>x.k===+k);if(!p)return;p.c=e.target.value;try{const r=await tx('readonly',s=>s.get(+k));r.cap=p.c;await tx('readwrite',s=>s.put(r,+k))}catch(x){}drawPh()});
function home2(){return`<h1>Estimation rénovation</h1>`+(S.props.length?'':`<div class='c'><small>Ajoute ta première adresse pour commencer.</small></div>`)+S.props.map((p,i)=>`<button class='tile' style='background:var(--bl);margin-bottom:12px' data-adr='${i}'>📍 ${esc(p.a)}<small>Budget travaux estimé : <span data-k='a${i}'></span></small></button><button class='del' data-rf='${i}' style='margin:-6px 0 12px'>↻ Rafraîchir (remettre à zéro)</button><button class='del' data-da='${i}' style='margin:-6px 0 12px 16px'>Supprimer l’adresse</button>`).join('')+`<div class='c add'><div class='f'><input type='text' id='na' placeholder='Adresse du bien (ex. 12 rue des Lilas, Liège)'><button id='addr'>+ Ajouter</button></div></div>`}
const hd=()=>`<div class='c'><div class='f' style='margin:0'><span>📍</span><input type='text' data-p='props.${S.cur}.a' value='${esc(S.props[S.cur].a)}' placeholder='Adresse du bien'></div><button class='del' data-rf='${S.cur}' style='margin-right:16px'>↻ Rafraîchir (remettre à zéro)</button><button class='del' id='dadr'>Supprimer cette adresse</button></div>`;
function tar(){const R=(l,k,d,u)=>{const v=P(k,d),o=(S.p||{})[k]||{};return`<div class='ln' style='flex-wrap:wrap'><span>${l} <small>${u}</small></span><div class='f' style='flex:0 0 100%;margin:0'>${I('p.'+k+'.0',v[0],'Prix min')}${I('p.'+k+'.1',v[1],'Prix max')}</div><div class='f' style='flex:0 0 100%;margin:0'>${I('p.'+k+'.2',o[2],'Main d’œuvre seule min')}${I('p.'+k+'.3',o[3],'Main d’œuvre seule max')}</div></div>`};return`<h1>Tarifs de référence</h1><small>Prix min et max en €, puis le prix de la main d’œuvre seule. Elle s’ajoute au prix quand elle est incluse dans la pièce ou le domaine.</small><div class='c' style='margin-top:10px'><h3>Espaces</h3>`+R('Sol parquet','sol_parquet',SOL.parquet,'€/m²')+R('Sol carrelage','sol_carrelage',SOL.carrelage,'€/m²')+R('Murs plafonnage / peinture','mur_plafonnage',MUR.plafonnage,'€/m²')+R('Murs carrelage','mur_carrelage',MUR.carrelage,'€/m²')+R('Plafond','pl',PL,'€/m²')+R('Cuisine équipée','meu_cuisine',MEU.cuisine,'€')+R('Salle de bain équipée','meu_sdb',MEU.sdb,'€')+`</div>`+T.map(c=>`<div class='c'><h3>${c[0]}</h3>`+c[1].map(it=>it[5]?it[5].map((o,j)=>R(it[1]+' – '+o[0],'i_'+it[0]+'_'+j,o.slice(1),'€/'+it[2])).join(''):R(it[1],'i_'+it[0],[it[3],it[4]],'€/'+it[2])).join('')+`</div>`).join('')+`<button class='del' id='rst'>Remettre les tarifs d’origine</button>`}
const pk=(a,lv)=>lv==null||lv==1?(a[0]+a[1])/2:lv==0?a[0]:a[1],LV=[[0,"Min"],[1,"Moyen"],[2,"Max"]];
function rc(r){let a=0,b=0,c=0;const f=(q,k,d,w,lv)=>{const p=P(k,d),l=(w??r.mo)!=0?LB(k):[0,0],x=[p[0]+l[0],p[1]+l[1]];a+=q*x[0];b+=q*x[1];c+=q*pk(x,lv)};
if(r.sOn)f(n(r.sol),'sol_'+r.sT,SOL[r.sT],r.sw,r.sv);if(r.mOn)f(mm(r),'mur_'+r.mT,MUR[r.mT],r.mw,r.mv);if(r.pOn)f(n(r.sol),'pl',PL,r.pw,r.pv);if(r.meu&&MEU[r.k])f(1,'meu_'+r.k,MEU[r.k],r.ew,r.ev);return[a,b,c]}
function ic(it){const s=S.t[it[0]];if(!s||!s.on)return[0,0,0];const p=it[5]?P('i_'+it[0]+'_'+n(s.o),it[5][n(s.o)].slice(1)):P('i_'+it[0],[it[3],it[4]]);const ci=T.findIndex(c=>c[1].includes(it)),k=it[5]?'i_'+it[0]+'_'+n(s.o):'i_'+it[0],l=((S.mc||{})[ci]!=0)?LB(k):[0,0];const q=qty(it[0],s),x=[p[0]+l[0],p[1]+l[1]];return[q*x[0],q*x[1],q*pk(x,s.lv)]}
const sum=a=>a.reduce((u,v)=>[u[0]+v[0],u[1]+v[1],u[2]+v[2]],[0,0,0]);
function tot(){const e=sum(S.rooms.map(rc)),cats=T.map(c=>[c[0],sum(c[1].map(ic))]),all=sum([e,...cats.map(c=>c[1])]),moy=all[2],imp=all[1]*n(S.imp)/100;return{e,cats,all,moy,imp,bud:moy+imp}}
function fin(){const t=tot(),fr=n(S.ach)*n(S.fr)/100,tv=t.bud*n(S.tva)/100,tt=n(S.ach)+t.bud+tv+fr,em=Math.max(0,tt-n(S.ap)),r=n(S.tx)/1200,N=n(S.mo)||1,M=r?em*r/(1-Math.pow(1+r,-N)):em/N,as=em*n(S.ass)/100/12;return{t,fr,tv,tt,em,M,as,mt:M+as,int:M*N-em,cass:as*N,cc:M*N-em+as*N}}
function kv(){const f=fin(),t=f.t,m={bud:E(t.bud),rng:rng(t.all),moy:E(t.moy),imp:E(t.imp),fr:E(f.fr),tv:E(f.tv),tt:E(f.tt),em:E(f.em),M:E(f.M),as:E(f.as),mt:E(f.mt),int:E(f.int),cass:E(f.cass),cc:E(f.cc)};
S.rooms.forEach((r,i)=>m["r"+i]=rng(rc(r)));T.forEach(c=>c[1].forEach(it=>m["i"+it[0]]=rng(ic(it))));[["Espaces",t.e],...t.cats].forEach((c,i)=>m["c"+i]=rng(c[1]));const c0=S.cur;S.props.forEach((p,i)=>{S.cur=i;m["a"+i]=E(tot().bud)});S.cur=c0;return m}
function upd(){const m=kv();document.querySelectorAll("[data-k]").forEach(e=>{if(m[e.dataset.k]!=null)e.textContent=m[e.dataset.k]});save()}
const I=(p,v,ph)=>`<input type="number" min="0" inputmode="decimal" data-p="${p}" value="${v??""}" placeholder="${ph||""}">`;
const C=(p,v,l)=>`<label class="sw"><input type="checkbox" data-p="${p}" ${v?"checked":""}>${l}</label>`;
const Sel=(p,v,o)=>`<select data-p="${p}">${o.map(x=>`<option value="${x[0]}" ${x[0]==v?"selected":""}>${x[1]}</option>`).join("")}</select>`;
function home(){const t=tot();return`<h1>Estimation rénovation</h1><div class="c hero"><small>Budget travaux estimé (moyenne + imprévus)</small><div class="bg" data-k="bud"></div><small data-k="rng"></small></div>
<div class="gd"><button class="tile" style="background:var(--gr)" data-go="e">Espaces<small>sol, murs, plafond</small></button><button class="tile" style="background:var(--rs)" data-go="t">Techniques<small>électricité, eau, isolation…</small></button></div>
<button class="tile" style="background:var(--bl)" data-go="s">Synthèse et financement</button>`}
function room(r,i){const p=`rooms.${i}.`;return`<details class="c" ${S.o[i]?"open":""} data-d="${i}"><summary><b>${r.n}</b><span data-k="r${i}"></span></summary>
<div class="b"><small>Châssis de la pièce</small><div class="f">${I(p+"ch",r.ch,"Nombre de châssis")}</div></div>
<div class="b g">${C(p+"sOn",r.sOn,"Sol à refaire")}<div class="f">${I(p+"sol",r.sol,"m² de sol")}${Sel(p+"sT",r.sT,[["parquet","Parquet"],["carrelage","Carrelage"]])}${Sel(p+"sv",r.sv??1,LV)}</div>${C(p+"sw",(r.sw??r.mo)!=0,"Main d'œuvre incluse")}</div>
<div class="b bl">${C(p+"mOn",r.mOn,"Murs à refaire")}<div class="f">${I(p+"m",r.m??(r.sol?mm(r):null),"m² murs (sol × 2,5)")}${Sel(p+"mT",r.mT,[["plafonnage","Plafonnage / peinture"],["carrelage","Carrelage"]])}${Sel(p+"mv",r.mv??1,LV)}</div>${C(p+"mw",(r.mw??r.mo)!=0,"Main d'œuvre incluse")}</div>
